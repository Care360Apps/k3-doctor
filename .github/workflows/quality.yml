name: K3 Flutter quality (no production calls)
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k3-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline import and file-safety check
        run: python3 tools/k3_preflight.py
      - name: Notification transport safety check
        run: python3 tools/k3_notification_preflight.py
      - name: Offline staging configuration tests
        run: python3 tools/test_staging_config.py
      - name: LAN debug build isolation regression (pure offline)
        run: python3 -m unittest discover -s tools -p 'test_k3_lan_build_config.py'
      - name: Android Play release gate regression (pure offline)
        run: python3 tools/test_k3_android_release_preflight.py
      - name: Android staging isolation regression (pure offline)
        run: python3 tools/test_k3_android_staging_identity.py
      - name: Android credential storage regression (pure offline)
        run: python3 tools/test_android_credential_hygiene.py
      - name: Notification desugaring configuration regression (pure offline)
        run: python3 tools/test_android_desugaring.py
      - name: Agora token log exposure regression (offline)
        run: python3 tools/test_agora_token_logging.py
      - name: iOS release metadata and push-token privacy (offline)
        run: python3 tools/test_ios_release_metadata.py
      - name: Production Firebase configuration isolation (offline)
        run: python3 tools/test_k3_production_config.py
      - name: Verify Gradle Wrapper integrity against official Gradle checksums
        uses: gradle/actions/wrapper-validation@v6
  # Independent verification: a source-safety failure must not hide Dart
  # analyzer/compiler errors. Both jobs remain required for a green workflow.
  flutter-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true
      - name: Enable Swift Package Manager for the Paystack plugin metadata
        run: flutter config --enable-swift-package-manager
      - name: Exclude iOS native project from Linux-only source checks
        run: |
          # Flutter 3.38 can incorrectly reject SwiftPM-only Paystack on Linux,
          # even when SwiftPM is enabled. No iOS build occurs in this workflow.
          # The iOS project is restored immediately after dependency resolution.
          test -d ios
          mv ios "$RUNNER_TEMP/k3-ios-project"
      - name: Install dependencies (Linux source only)
        run: |
          flutter pub get
      - name: Restore iOS project for complete source inspection
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/k3-ios-project" ]; then
            test ! -e ios
            mv "$RUNNER_TEMP/k3-ios-project" ios
          fi
      - name: Generate Retrofit sources if required
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Enforce environment-defined API URL in Retrofit code
        run: python3 tools/k3_rewrite_generated_url.py
      - name: Analyze source
        # Report existing warning/info debt while failing on analyzer errors.
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - name: Complete offline Flutter regression suite
        shell: bash
        run: |
          mapfile -t tests < <(find test -maxdepth 1 -type f -name '*.dart' ! -name 'base_url_test.dart' | sort)
          test "${#tests[@]}" -gt 0
          flutter test --no-pub --concurrency=2 "${tests[@]}"
