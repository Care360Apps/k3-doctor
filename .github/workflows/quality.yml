name: K3 Flutter quality (no production calls)
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k3-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline import and file-safety check
        run: python3 tools/k3_preflight.py
      - name: Notification transport safety check
        run: python3 tools/k3_notification_preflight.py
      - name: Offline staging configuration tests
        run: python3 tools/test_staging_config.py
      - name: Verify Gradle Wrapper integrity against official Gradle checksums
        uses: gradle/actions/wrapper-validation@v6
  flutter-analyze:
    needs: source-safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Enable Swift Package Manager for the Paystack plugin metadata
        run: flutter config --enable-swift-package-manager
      - name: Exclude iOS native project from Linux-only source checks
        run: |
          # Flutter 3.38 can incorrectly reject SwiftPM-only Paystack on Linux,
          # even when SwiftPM is enabled. No iOS build occurs in this workflow.
          # The iOS project is restored immediately after dependency resolution.
          test -d ios
          mv ios "$RUNNER_TEMP/k3-ios-project"
      - name: Install dependencies (Linux source only)
        run: |
          flutter pub get
      - name: Restore iOS project for complete source inspection
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/k3-ios-project" ]; then
            test ! -e ios
            mv "$RUNNER_TEMP/k3-ios-project" ios
          fi
      - name: Generate Retrofit sources if required
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Enforce environment-defined API URL in Retrofit code
        run: python3 tools/k3_rewrite_generated_url.py
      - name: Analyze source
        # Report existing warning/info debt while failing on analyzer errors.
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - name: Offline tests only
        run: flutter test --no-pub test/k3_offline_smoke_test.dart test/k3_startup_gate_test.dart test/k3_entry_brand_test.dart test/k3_connection_error_test.dart
      - name: Care360 Plus master-brand widget regression
        run: flutter test --no-pub test/care360_brand_test.dart
